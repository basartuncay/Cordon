name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy src evals

      - name: Test (pytest)
        run: uv run pytest -v

      - name: Corpus integrity (schema + holdout rules, no API calls)
        run: |
          uv run python -m evals.holdout_check
          for d in evals/corpus evals/corpus/holdout evals/corpus/contact-gap evals/corpus/p6cost; do
            uv run python -m evals.corpus_check "$d"
          done

      - name: Worst-case table (offline reproduction of the README numbers)
        run: uv run python -m evals.worst_case >> "$GITHUB_STEP_SUMMARY"
