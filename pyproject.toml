[project]
name = "cordon"
version = "0.2.2"
description = "Research prototype: a CaMeL-inspired mail & calendar agent (mock environment) with provenance tracking, a deterministic policy engine, and an honest prompt-injection evaluation."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Basar Tuncay" }
]
requires-python = ">=3.12"
keywords = ["prompt-injection", "llm-security", "agents", "camel", "evaluation"]

dependencies = [
    "anthropic>=1.7.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/basartuncay/Cordon"
Results = "https://github.com/basartuncay/Cordon/blob/main/docs/results.md"
"Threat model" = "https://github.com/basartuncay/Cordon/blob/main/docs/threat-model.md"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.11",
]

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not smoke_real_api'"
markers = [
    "smoke_real_api: makes a real Anthropic API call and costs real money; excluded by default (see tests/test_smoke_real_api.py) — run with `uv run pytest -m smoke_real_api`",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
