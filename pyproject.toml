[project]
name = "cordon"
version = "0.1.0"
description = "A CaMeL-inspired agent for Gmail/Calendar resistant to prompt injection, with provenance tracking and a deterministic policy engine."
authors = [
    { name = "Basar Tuncay", email = "basarmeta@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.7.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
cordon = "cordon:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.11",
]

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not smoke_real_api'"
markers = [
    "smoke_real_api: makes a real Anthropic API call and costs real money; excluded by default (see tests/test_smoke_real_api.py) — run with `uv run pytest -m smoke_real_api`",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
